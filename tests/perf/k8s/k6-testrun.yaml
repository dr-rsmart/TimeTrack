# =============================================================================
# TimeTrack — k6 Operator TestRun (Phase C: 5,000 VUs across 2 worker nodes)
# =============================================================================
# Prerequisites:
#   kubectl apply -f https://raw.githubusercontent.com/grafana/k6-operator/main/config/crd/bases/k6.io_testruns.yaml
#   (or install via Helm: helm install k6-operator grafana/k6-operator -n k6)
#
# This TestRun shards the Phase C script across 2 runner pods. Each runner
# receives K6_INSTANCE_ID (0/1) and K6_CLOUD_PUSH_REF for aggregation.
# The script must divide its VU target by the instance count — protocol.js
# and timetrack-stress-5000vu.js support VU_SCALE for this purpose.
#
# Apply:
#   kubectl apply -f tests/perf/k8s/k6-testrun.yaml
#   kubectl get testruns -n k6 -w
#   kubectl logs -n k6 testrun/timetrack-phase-c-stress --all-containers
# =============================================================================

apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: timetrack-phase-c-stress
  namespace: k6
spec:
  # Number of k6 runner pods (worker nodes). 5,000 VUs split evenly = 2,500 each.
  parallelism: 2

  # Script is loaded from a ConfigMap (create it first):
  #   kubectl create configmap k6-scripts -n k6 \
  #     --from-file=timetrack-stress-5000vu.js=tests/perf/timetrack-stress-5000vu.js
  script:
    configMap:
      name: k6-scripts
      file: timetrack-stress-5000vu.js

  # k6 CLI arguments shared by all runners
  arguments: >-
    --out json=/tmp/k6-results.json
    --summary-export=/tmp/k6-summary.json
    -e API_URL=http://timetrack-api.default.svc.cluster.local:4000
    -e PERF_TEST_SECRET=tt_perf_bench_2026
    -e VU_SCALE=0.5

  # Runner pod spec — pin to dedicated load-generator nodes so the system
  # under test (API + DB) is not starved by the load generator itself.
  runner:
    image: grafana/k6:latest
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    # Anti-affinity: spread the 2 workers across different nodes
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: k6
            topologyKey: kubernetes.io/hostname
    # Tolerate load-gen taint if you dedicate nodes
    tolerations:
      - key: "loadgen"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    env:
      - name: K6_NO_USAGE_REPORT
        value: "true"

  # Separate starter pod coordinates the runners (k6 operator handles this
  # automatically via the test lifecycle: init → run → finalize).
  separate: false

---
# =============================================================================
# ConfigMap holding the k6 scripts (generated by CI or manually)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-scripts
  namespace: k6
data:
  # Populated via: kubectl create configmap k6-scripts --from-file=...
  # Placeholder key so the manifest is valid standalone.
  timetrack-stress-5000vu.js: |
    // Injected by CI: kubectl create configmap k6-scripts \
    //   --from-file=timetrack-stress-5000vu.js=tests/perf/timetrack-stress-5000vu.js
    export default function () {}

---
# =============================================================================
# Auto-scaling configuration for the SYSTEM UNDER TEST during stress phases
# =============================================================================
# The API must scale out to absorb 5,000 concurrent VUs. HorizontalPodAutoscaler
# keys off CPU; the API is stateless EXCEPT for in-memory rate limits and the
# SSE registry — see PERFORMANCE_AUDIT_REPORT.md §(i) Bottlenecks before
# enabling >1 replica (Redis externalization is a prerequisite).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: timetrack-api-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: timetrack-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300