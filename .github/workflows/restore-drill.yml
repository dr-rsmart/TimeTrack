name: Restore Drill

# Weekly automated DR drill (Phase 2, item 12): proves the backup + restore
# tooling actually works end-to-end. Builds a live PostgreSQL 16, applies the
# recorded migrations + demo seed, takes a real pg_dump backup with
# server/backup_db.mjs, then restores it into a scratch database with
# server/restore_drill.mjs and verifies row counts (measured RTO is printed
# for docs/OPERATIONS.md). Any tooling regression turns this pipeline red
# instead of surfacing during a real disaster.

on:
  schedule:
    # Mondays 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  restore-drill:
    name: Backup + restore drill (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pg_password
          POSTGRES_DB: timetrack_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:ci_pg_password@localhost:5432/timetrack_drill?schema=public
      JWT_SECRET: 7c1e9f4b2a8d3e6c5b0a9f8e7d6c5b4a39281706f5e4d3c2b1a099887766554433221100ffeeddccbbaa998877665544
      NODE_ENV: test
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply recorded migrations + demo seed
        working-directory: server
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma migrate deploy --schema=prisma/schema.prisma
          npm run seed

      # ubuntu-latest ships PostgreSQL 16 client tools (pg_dump/pg_restore/
      # psql/dropdb) matching the service image major version.
      - name: Take a real backup (pg_dump custom format)
        working-directory: server
        run: node backup_db.mjs

      - name: Restore drill (scratch DB + row-count verification + RTO)
        working-directory: server
        run: node restore_drill.mjs
